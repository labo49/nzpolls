name: Refresh poll data

on:
  schedule:
    # Twice daily, 12h apart -- evening (catches the day's just-published
    # polls) and morning (catches anything published overnight). Cron is
    # fixed UTC and doesn't follow NZ daylight saving, so these track
    # 7pm/7am NZST (UTC+12) and drift to 8pm/8am during NZDT (UTC+13, late
    # Sep-early Apr) -- same tradeoff the original single run accepted
    # rather than re-pointing the schedule twice a year.
    - cron: "0 7 * * *" # ~7pm NZST / 8pm NZDT
    - cron: "0 19 * * *" # ~7am NZST / 8am NZDT (next NZ day)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run fetch-polls

      - run: npm run fetch-approval

      - run: npm run fetch-milestones

      - id: diff
        run: echo "changed=$(git status --porcelain data/ | wc -l)" >> "$GITHUB_OUTPUT"

      - id: create-pr
        if: steps.diff.outputs.changed != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh poll data"
          title: "chore: refresh poll data"
          body: Automated poll data refresh from the Wikipedia opinion-polling table.
          branch: automated/refresh-polls
          add-paths: data/

      - if: steps.create-pr.outputs.pull-request-number
        run: gh pr merge --squash --delete-branch "${{ steps.create-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # create-pull-request resets this checkout back to the pre-refresh
      # commit once it has branched off the new data (so the job's working
      # directory doesn't stay dirty) -- the merge above only updates the
      # remote, so without this pull, post-social below would still see the
      # stale pre-refresh data/newPolls.json and think nothing new arrived.
      - if: steps.create-pr.outputs.pull-request-number
        run: git pull origin "${{ github.ref_name }}"

      - if: steps.create-pr.outputs.pull-request-number
        run: npm run post-social
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
